services:
  db:
    image: postgres:16-alpine
    container_name: avanzapp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avanzadb}
      POSTGRES_USER: ${POSTGRES_USER:-avanzapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avanzapp} -d ${POSTGRES_DB:-avanzadb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: avanzapp
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-avanzadb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-avanzapp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-36000000}
      PDF_STORAGE_DIR: /app/storage/pdfs
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pdf_data:/app/storage/pdfs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pdf_data:
