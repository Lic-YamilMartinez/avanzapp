services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: avanzapp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/avanzadb
      SPRING_DATASOURCE_USERNAME: avanzapp
      SPRING_DATASOURCE_PASSWORD: avanzapp
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: avanzapp-postgres
    environment:
      POSTGRES_DB: avanzadb
      POSTGRES_USER: avanzapp
      POSTGRES_PASSWORD: avanzapp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres_data:
