name: Compras IRP CI

on:
  push:
    branches:
      - feat/compras-irp
  pull_request:
    branches:
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar backend
        run: ./mvnw -DskipTests package
      - name: Tests Compras IRP
        run: ./mvnw -Dtest=DNITComprasImportServiceTest,DNITComprasFuenteSelectorTest,ObservacionIrpNormalizerTest test
